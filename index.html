<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KR Mohammed Affan & P Afreen Roohi | Wedding Invitation</title>
  
  <meta property="og:title" content="KR Mohammed Affan & P Afreen Roohi | Wedding Invitation">
  <meta property="og:description" content="We request the honor of your presence to celebrate our wedding. Tap to view the interactive invitation & RSVP.">
  <meta property="og:image" content="assets/couple-hero.jpg">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#FAF6F0">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: #FAF6F0;
    }
    #invitationFrame {
      width: 100%; height: 100%;
      border: none; display: block;
      position: absolute; inset: 0;
    }
    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background-color: #FAF6F0;
      font-family: serif; color: #6B333B;
      transition: opacity 0.4s ease;
      z-index: 100;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 2px solid #C5A059;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <p style="letter-spacing: 0.25em; font-size: 11px; text-transform: uppercase; font-weight: 600;">Opening Invitation...</p>
  </div>

  <iframe id="invitationFrame" src="template1.html" allow="autoplay"></iframe>

  <script>
    const SUPABASE_URL = "https://nvmlebskojjrgumuvwci.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52bWxlYnNrb2pqcmd1bXV2d2NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjExNzMsImV4cCI6MjEwMjY5NzE3M30.1VfcgQqMM0YnEZZsFFKy3ICvdh6_i-VSZtIfusNMAHM";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const frame = document.getElementById('invitationFrame');
    const loader = document.getElementById('loader');

    frame.onload = () => {
      loader.style.opacity = '0';
      setTimeout(() => {
        loader.style.display = 'none';
      }, 300);
    };

    async function loadActiveTemplate() {
      const urlParams = new URLSearchParams(window.location.search);
      const manualParam = urlParams.get('t');

      if (manualParam === '2') {
        frame.src = 'template2.html';
        return;
      } else if (manualParam === '1') {
        frame.src = 'template1.html';
        return;
      }

      try {
        const { data } = await db.from('app_settings').select('active_template').eq('id', 1).single();
        if (data && data.active_template === 'template2') {
          frame.src = 'template2.html';
        } else {
          frame.src = 'template1.html';
        }
      } catch (err) {
        frame.src = 'template1.html';
      }
    }

    loadActiveTemplate();
  </script>
</body>
</html>
